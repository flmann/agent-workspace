# Run from the project you want the agent to work on:
#   docker compose -f /path/to/this/docker-compose.yml run --rm agent claude
# The current directory (PWD) is mounted at /workspace.
# Copy .env.sample to .env (next to this file) and adjust it first.
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    image: agent-sandbox

    stdin_open: true
    tty: true
    working_dir: /workspace

    # --- Security hardening ---
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # --- Resource limits ---
    pids_limit: 512
    mem_limit: ${AGENT_MEM_LIMIT:-4g}
    cpus: ${AGENT_CPUS:-2}

    # --- Mounts ---
    volumes:
      # Current directory -> /workspace
      - ${PWD}:/workspace
      # Directory from .env -> home of the 'agent' user (auth, config, history)
      - ${AGENT_HOME:?set AGENT_HOME in .env}:/home/agent

    # Writable scratch space, since the root filesystem is read-only
    tmpfs:
      - /tmp:exec,mode=1777
      - /home/agent/.cache:mode=1777

    # Only variables that are set in .env or the shell are passed through.
    environment:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      SCADSAI_API_KEY:
      GH_TOKEN:
      GITLAB_TOKEN:
      TZ: ${TZ:-Europe/Berlin}

    # No fixed command: pick the agent at run time
    # (claude | codex | opencode | omp | bash)
    command: ["bash"]
