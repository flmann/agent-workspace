services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
        # Agents to install; set to false in .env to skip
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-true}
        INSTALL_CODEX: ${INSTALL_CODEX:-true}
        INSTALL_OPENCODE: ${INSTALL_OPENCODE:-true}
        INSTALL_OMP: ${INSTALL_OMP:-true}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        INSTALL_FREECAD_MCP: ${INSTALL_FREECAD_MCP:-false}
    image: agent-sandbox

    stdin_open: true
    tty: true
    working_dir: /workspace
    read_only: true # Set to false to enable apt install or editing /usr /etc /opt ...
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${AGENT_MEM_LIMIT:-4g} # Set in .env
    cpus: ${AGENT_CPUS:-2} # Set in .env
    volumes:
      - ${PWD}:/workspace
      - ${AGENT_HOME:?set AGENT_HOME in .env}:/home/agent
    extra_hosts:
      - host.docker.internal:host-gateway # Reach host services, e.g. FreeCAD's RPC server
    tmpfs:
      - /tmp:exec,mode=1777     # Writable tmp, since the root filesystem is read-only
      - /home/agent/.cache:mode=1777
    environment:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      SCADSAI_API_KEY:
      GH_TOKEN:
      GITLAB_TOKEN:
      TZ: ${TZ:-Europe/Berlin}
    command: ["bash"]
